<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>발주 도우미 390px 미리보기 (임시 검증용)</title>
<style>
  html, body { margin: 0; padding: 0; background: #666; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .phone { width: 390px; height: 800px; border: 0; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .phone.small { width: 320px; height: 700px; }
  .label { color: #fff; font-size: 12px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="label">390px</div>
    <iframe class="phone" id="p390" src="./index.html"></iframe>
  </div>
  <div>
    <div class="label">320px</div>
    <iframe class="phone small" id="p320" src="./index.html"></iframe>
  </div>
</div>
</body>
</html>
